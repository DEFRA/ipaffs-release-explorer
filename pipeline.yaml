# PRs validate on an isolated hosted agent. Only main can publish and deploy.
trigger:
  branches:
    include:
      - main
pr:
  autoCancel: true
  drafts: true
  branches:
    include:
      - main

name: $(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: namespace
    displayName: Dedicated DEV namespace
    type: string
    default: ipaffs-release-explorer

variables:
  # Resources must be available at pipeline scope for ADO authorisation.
  # The group is absent from the compiled PR/non-main pipeline.
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest')) }}:
      - group: ReleaseExplorerDEV
  - name: imageRepository
    value: ipaffs/ipaffs-release-explorer
  - name: helmVersion
    value: 3.20.2

stages:
  - stage: Validate
    displayName: Test and build
    pool:
      vmImage: ubuntu-24.04
    jobs:
      - job: ValidateApp
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: NodeTool@0
            displayName: Use Node.js 24
            inputs:
              versionSpec: 24.x
          - script: npm test
            displayName: Test application
          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: $(helmVersion)
          - bash: bash deploy/scripts/validate-chart.sh
            displayName: Validate Helm chart
          - bash: az bicep build --file infrastructure/workload-identity.bicep --outfile "$(Agent.TempDirectory)/release-explorer-identity.json"
            displayName: Validate identity template
          - bash: bash deploy/scripts/validate-image.sh
            displayName: Build and smoke-test container
            env:
              BUILD_ID: $(Build.BuildId)

  # Omit Azure resources entirely when compiling a PR or a non-main branch run.
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest')) }}:
      - stage: Publish
        displayName: Publish container and chart
        dependsOn: Validate
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
        pool:
          name: $(agentPool)
        jobs:
          - job: PublishImage
            steps:
              - checkout: self
                clean: true
                persistCredentials: false
              - task: HelmInstaller@1
                displayName: Install Helm
                inputs:
                  helmVersionToInstall: $(helmVersion)
              - task: AzureCLI@2
                displayName: Build container and push to DEV ACR
                env:
                  ACR_NAME: $(acrName)
                  IMAGE_REPOSITORY: $(imageRepository)
                  BUILD_ID: $(Build.BuildId)
                  SOURCE_REVISION: $(Build.SourceVersion)
                  ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)/release-explorer
                  DOCKER_CONFIG: $(Agent.TempDirectory)/release-explorer-docker-$(Build.BuildId)
                inputs:
                  azureSubscription: $(serviceConnection)
                  scriptType: bash
                  scriptLocation: scriptPath
                  scriptPath: deploy/scripts/build-push.sh
                  workingDirectory: $(Build.SourcesDirectory)
                  visibleAzLogin: false
              - task: PublishPipelineArtifact@1
                displayName: Publish deployment package
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/release-explorer
                  artifact: release-explorer

      - stage: DeployDEV
        displayName: Deploy release explorer to DEV
        dependsOn: Publish
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
        pool:
          name: $(agentPool)
        jobs:
          - deployment: DeployExplorer
            displayName: Install chart in dedicated namespace
            environment: DEV
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      clean: true
                      persistCredentials: false
                    - download: current
                      artifact: release-explorer
                    - task: HelmInstaller@1
                      displayName: Install Helm
                      inputs:
                        helmVersionToInstall: $(helmVersion)
                    - task: AzureCLI@2
                      name: provisionIdentity
                      displayName: Create or update app identity and federation
                      env:
                        AKS_NAME: $(kubernetesCluster)
                        AKS_RESOURCE_GROUP: $(resourceGroupName)
                        NAMESPACE: ${{ parameters.namespace }}
                        IDENTITY_DEPLOYMENT_NAME: release-explorer-$(Build.BuildId)
                      inputs:
                        azureSubscription: $(serviceConnection)
                        scriptType: bash
                        scriptLocation: scriptPath
                        scriptPath: deploy/scripts/bootstrap-identity.sh
                        arguments: --apply --pipeline
                        workingDirectory: $(Build.SourcesDirectory)
                        visibleAzLogin: false
                    - task: AzureCLI@2
                      displayName: Check identity and deploy to DEV AKS
                      env:
                        AKS_NAME: $(kubernetesCluster)
                        AKS_RESOURCE_GROUP: $(resourceGroupName)
                        ACR_NAME: $(acrName)
                        NAMESPACE: ${{ parameters.namespace }}
                        IDENTITY_RESOURCE_ID: $(provisionIdentity.identityResourceId)
                        IDENTITY_CLIENT_ID: $(provisionIdentity.clientId)
                        IDENTITY_TENANT_ID: $(provisionIdentity.tenantId)
                        ADO_ORGANIZATION: $(ADO_ORGANIZATION)
                        ADO_PROJECT: $(ADO_PROJECT)
                        ADO_DEV_PIPELINE_ID: $(ADO_DEV_PIPELINE_ID)
                        ADO_CREATE_RELEASE_PIPELINE_ID: $(ADO_CREATE_RELEASE_PIPELINE_ID)
                        ADO_RELEASE_PIPELINE_ID: $(ADO_RELEASE_PIPELINE_ID)
                        ADO_QA_PIPELINE_ID: $(ADO_QA_PIPELINE_ID)
                        INGRESS_HOST: $(ingressHost)
                        INGRESS_SKIP_TLS_VERIFY: $(ingressSkipTlsVerify)
                        ARTIFACT_DIR: $(Pipeline.Workspace)/release-explorer
                        DEPLOY_TEMP_DIR: $(Agent.TempDirectory)/release-explorer-$(Build.BuildId)
                      inputs:
                        azureSubscription: $(serviceConnection)
                        scriptType: bash
                        scriptLocation: scriptPath
                        scriptPath: deploy/scripts/deploy-dev.sh
                        workingDirectory: $(Build.SourcesDirectory)
                        visibleAzLogin: false
