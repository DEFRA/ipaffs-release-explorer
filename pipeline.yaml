# Standalone repository pipeline. Run manually until the first DEV setup is complete.
trigger: none
pr: none

name: $(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: namespace
    displayName: Dedicated DEV namespace
    type: string
    default: ipaffs-release-explorer

pool:
  name: $(agentPool)

variables:
  # Keep organisation, infrastructure and identity configuration in ADO.
  # See deploy/README.md for the complete non-secret variable contract.
  - group: ReleaseExplorerDEV
  - name: imageRepository
    value: ipaffs/ipaffs-release-explorer
  - name: helmVersion
    value: 3.20.2
  # Add these three non-secret variables to ReleaseExplorerDEV after identity setup:
  # RELEASE_EXPLORER_IDENTITY_RESOURCE_ID
  # RELEASE_EXPLORER_IDENTITY_CLIENT_ID
  # RELEASE_EXPLORER_IDENTITY_TENANT_ID

stages:
  - stage: Build
    displayName: Test, build and push
    jobs:
      - job: BuildImage
        steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - task: NodeTool@0
            displayName: Use Node.js 24
            inputs:
              versionSpec: 24.x
          - script: npm test
            displayName: Test application
          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: $(helmVersion)
          - bash: bash deploy/scripts/validate-chart.sh
            displayName: Validate Helm chart
          - task: AzureCLI@2
            displayName: Build container and push to DEV ACR
            env:
              ACR_NAME: $(acrName)
              IMAGE_REPOSITORY: $(imageRepository)
              BUILD_ID: $(Build.BuildId)
              SOURCE_REVISION: $(Build.SourceVersion)
              ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)/release-explorer
              DOCKER_CONFIG: $(Agent.TempDirectory)/release-explorer-docker-$(Build.BuildId)
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: deploy/scripts/build-push.sh
              workingDirectory: $(Build.SourcesDirectory)
              visibleAzLogin: false
          - task: PublishPipelineArtifact@1
            displayName: Publish deployment package
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/release-explorer
              artifact: release-explorer

  - stage: DeployDEV
    displayName: Deploy release explorer to DEV
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployExplorer
        displayName: Install chart in dedicated namespace
        environment: DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  persistCredentials: false
                - download: current
                  artifact: release-explorer
                - task: HelmInstaller@1
                  displayName: Install Helm
                  inputs:
                    helmVersionToInstall: $(helmVersion)
                - task: AzureCLI@2
                  displayName: Check identity and deploy to DEV AKS
                  env:
                    AKS_NAME: $(kubernetesCluster)
                    AKS_RESOURCE_GROUP: $(resourceGroupName)
                    ACR_NAME: $(acrName)
                    NAMESPACE: ${{ parameters.namespace }}
                    IDENTITY_RESOURCE_ID: $(RELEASE_EXPLORER_IDENTITY_RESOURCE_ID)
                    IDENTITY_CLIENT_ID: $(RELEASE_EXPLORER_IDENTITY_CLIENT_ID)
                    IDENTITY_TENANT_ID: $(RELEASE_EXPLORER_IDENTITY_TENANT_ID)
                    ADO_ORGANIZATION: $(ADO_ORGANIZATION)
                    ADO_PROJECT: $(ADO_PROJECT)
                    ADO_DEV_PIPELINE_ID: $(ADO_DEV_PIPELINE_ID)
                    ADO_CREATE_RELEASE_PIPELINE_ID: $(ADO_CREATE_RELEASE_PIPELINE_ID)
                    ADO_RELEASE_PIPELINE_ID: $(ADO_RELEASE_PIPELINE_ID)
                    ADO_QA_PIPELINE_ID: $(ADO_QA_PIPELINE_ID)
                    ARTIFACT_DIR: $(Pipeline.Workspace)/release-explorer
                    DEPLOY_TEMP_DIR: $(Agent.TempDirectory)/release-explorer-$(Build.BuildId)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: deploy/scripts/deploy-dev.sh
                    workingDirectory: $(Build.SourcesDirectory)
                    visibleAzLogin: false
