{{- $name := include "explorer.name" . -}}
{{- $serviceHosts := list (printf "%s:4317" $name) (printf "%s.%s.svc:4317" $name .Release.Namespace) (printf "%s.%s.svc.cluster.local:4317" $name .Release.Namespace) -}}
{{- $ingressHosts := list -}}
{{- if .Values.ingress.enabled -}}
{{- $ingressHosts = list .Values.ingress.host (printf "%s:443" .Values.ingress.host) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "explorer.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "4317"
  NODE_ENV: production
  ALLOWED_HOSTS: {{ concat .Values.allowedHosts $serviceHosts $ingressHosts | uniq | join "," | quote }}
  ADO_ORGANIZATION: {{ .Values.ado.organization | quote }}
  ADO_PROJECT: {{ .Values.ado.project | quote }}
  ADO_DEV_PIPELINE_ID: {{ .Values.ado.pipelines.dev | quote }}
  ADO_CREATE_RELEASE_PIPELINE_ID: {{ .Values.ado.pipelines.createRelease | quote }}
  ADO_RELEASE_PIPELINE_ID: {{ .Values.ado.pipelines.release | quote }}
  ADO_QA_PIPELINE_ID: {{ .Values.ado.pipelines.qa | quote }}
  ADO_RUNS_PER_PIPELINE: {{ .Values.ado.runsPerPipeline | quote }}
  ADO_CACHE_SECONDS: {{ .Values.ado.cacheSeconds | quote }}
