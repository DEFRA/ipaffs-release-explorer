apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "explorer.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "workloadIdentity.tenantId is required" .Values.workloadIdentity.tenantId | quote }}
# The workload identity webhook projects a separate Entra exchange token.
# Namespace checks use an explicit short-lived API token mounted by the Deployment.
automountServiceAccountToken: false
