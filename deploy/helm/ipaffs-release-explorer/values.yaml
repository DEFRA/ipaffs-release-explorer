replicaCount: 1

image:
  repository: ""
  # Deployment always uses the digest produced by the build stage.
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  name: ipaffs-release-explorer

workloadIdentity:
  clientId: ""
  tenantId: ""

ado:
  # Required at deployment time; no organisation or pipeline identifiers are public defaults.
  organization: ""
  project: ""
  pipelines:
    dev: ""
    createRelease: ""
    release: ""
    qa: ""
  runsPerPipeline: 100
  cacheSeconds: 90

# Optional public-facing URLs for the canonical dev namespace; configure both together.
# Other namespaces continue to use the URLs recorded by their deployment runs.
devUrls:
  b2c: ""
  b2b: ""

# Explicit host headers only. The chart also permits its own Service DNS names.
allowedHosts:
  - 127.0.0.1:4317
  - localhost:4317

ingress:
  enabled: false
  className: nginx
  host: ""
  # Leave empty to use the ingress controller's default TLS certificate.
  tlsSecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
